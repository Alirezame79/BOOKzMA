name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookzma
          POSTGRES_PASSWORD: bookzma
          POSTGRES_DB: bookzma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookzma -d bookzma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bookzma:bookzma@localhost:5432/bookzma_test
      TEST_DATABASE_URL: postgresql+asyncpg://bookzma:bookzma@localhost:5432/bookzma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bookzma:ci .
